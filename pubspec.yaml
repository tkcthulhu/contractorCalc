name: contractorcalc
description: Offline construction calculator for contractors and tradespeople.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.7 <3.14.0'
  flutter: '3.47.8'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  drift: 2.35.3
  sqlite3: 3.8.0
  path_provider: 2.1.6
  path_provider_android: 2.3.1
  path_provider_foundation: 2.6.0
  path: 1.9.1
  crypto: 3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  drift_dev: 2.35.2
  build_runner: 2.17.1
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
